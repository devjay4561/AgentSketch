name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and test
        run: ./scripts/build.ps1
      - name: Package
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: agentsketch-windows
          path: |
            release/AgentSketch-Windows.zip
            release/AgentSketch-source.zip

  macos:
    name: Build macOS universal release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and test
        run: ./scripts/build.sh --arch universal
      - name: Package app bundle
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agentsketch-macos
          path: |
            release/AgentSketch-macOS-*.zip
            release/AgentSketch-macOS-*.dmg

  publish:
    name: Publish one combined release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agentsketch-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
