name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build (npm ci → frontend → tests → Wails)
        run: ./scripts/build.ps1

      - name: Package
        run: ./scripts/package.ps1

      - name: Checksums
        working-directory: release
        run: |
          Get-FileHash -Algorithm SHA256 -LiteralPath AgentSketch-Windows.zip, AgentSketch-source.zip |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path -Leaf $_.Path) } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AgentSketch-${{ github.ref_name }}
          path: |
            release/AgentSketch-Windows.zip
            release/AgentSketch-source.zip
            release/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/AgentSketch-Windows.zip
            release/AgentSketch-source.zip
            release/SHA256SUMS.txt
