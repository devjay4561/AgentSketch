name: 🐞 버그 제보
description: 예상과 다르게 동작하는 문제를 알려 주세요.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        보안 취약점은 이 양식 대신 [비공개 제보](https://github.com/devjay4561/AgentSketch/security/advisories/new)를 사용해 주세요.
        첨부하는 파일·캡처에 개인 정보나 회사 내부 자료가 없는지 확인해 주세요.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      description: 실제 동작과 기대한 동작을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      placeholder: |
        1. 파일 → 새 보드
        2. ...
        3. 오류 발생
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentSketch 버전
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 사용 경로
      options:
        - 데스크톱 앱 (AgentSketch.exe)
        - CLI / MCP
        - 브라우저 개발 모드
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows·WebView2 버전
      placeholder: Windows 11 24H2, WebView2 156
  - type: textarea
    id: extra
    attributes:
      label: 추가 정보
      description: 스크린샷, 최소 재현 `.agentsketch` 파일, 콘솔 오류 등을 첨부해 주세요.
